[OPTIONS]
SHOW_TITLE_BAR=true ; Show GridTalk title (turn off to hide the title text; the bar still appears when you hover the window so you can drag it)
BACKGROUND_OPACITY=0.40 ; Window background opacity (0 is fully transparent; the user pills are not affected); from 0 to 1, per, round to 0.05
SPEAKING_HOLD_SECONDS=0 ; Keep speakers green for extra time (seconds after they stop talking, 0 turns this off); from 0 s to 10, round to 0.5
